<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="GameHot">
  <defs>
    <linearGradient id="heat" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2d95"/>
      <stop offset="55%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="#0b062e"/>
  <!-- soft glow -->
  <circle cx="256" cy="250" r="150" fill="url(#heat)" opacity="0.18"/>
  <!-- gamepad body -->
  <rect x="118" y="200" width="276" height="148" rx="74" fill="url(#heat)"/>
  <rect x="118" y="200" width="276" height="148" rx="74" fill="#12083f" opacity="0.35"/>
  <!-- D-pad -->
