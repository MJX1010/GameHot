  <rect x="183" y="233" width="14" height="44" rx="3" fill="#0b062e"/>
  <!-- action buttons -->
  <circle cx="320" cy="242" r="12" fill="#22d3ee"/>
  <circle cx="348" cy="268" r="12" fill="#ff2d95"/>
  <circle cx="292" cy="268" r="12" fill="#a78bfa"/>
  <circle cx="320" cy="294" r="12" fill="#fbbf24"/>
  <!-- heat flame accent above pad -->
  <path d="M256 120c18 28 28 48 28 72 0 28-18 48-28 48s-28-20-28-48c0-24 10-44 28-72z" fill="#ff2d95" opacity="0.95"/>
  <path d="M256 152c10 16 16 28 16 42 0 16-10 28-16 28s-16-12-16-28c0-14 6-26 16-42z" fill="#22d3ee" opacity="0.85"/>
